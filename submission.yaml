# =============================================================================
# HACKATHON SUBMISSION METADATA
# =============================================================================
# Instructions:
#   - Fill in ALL required fields (marked with # REQUIRED)
#   - Optional fields can be left as empty strings ""
#   - Do NOT rename this file — the evaluation pipeline reads it by name
#   - Use double quotes around all string values
# =============================================================================

team:
  name: "TrialGuard Team"              # REQUIRED — e.g., "Orion Squad"
  track: "AI"                          # REQUIRED — one of: AI | DevOps | Sustainability | Open
  lead:
    name: "Tarjani Patel"              # REQUIRED — e.g., "Alice Chen"
    email: "tarjani.patel@ibm.com"     # REQUIRED — e.g., "alice.chen@ibm.com"
  members:
    - name: "Tarjani Patel"            # REQUIRED — Team member 1
      email: "tarjani.patel@ibm.com"
    - name: "Clinical AI Lead"
      email: "clinical.ai@trialguard.org"

submission:
  title: "TrialGuard AI"               # REQUIRED — Project display name

  problem_statement: >                 # REQUIRED — 1-3 sentences
    Clinical trials suffer from severe protocol compliance failures, where over 70% of trials experience protocol deviations that delay drug approvals, escalate monitoring costs by millions, and endanger participant safety. Clinical Research Associates (CRAs) currently struggle with retrospective, manual monitoring across disparate EDC and site logs, leaving deviations undiscovered until audit cycles.

  solution_summary: >                  # REQUIRED — 1-3 sentences
    TrialGuard AI is an agentic clinical-trial compliance copilot that continuously validates patient activity against trial protocols using a deterministic compliance engine. It detects and explains protocol deviations (Protocol Requirement vs Actual Data), identifies high-risk sites, forecasts emerging risk trajectories, and autonomously generates Corrective and Preventive Actions (CAPA) with mandatory human review.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Deterministic Compliance Engine validating visit windows, dosing, prohibited concomitant medications, and mandatory safety labs without LLM hallucinations"
    - "Normalized 0-100 Site Risk Scoring with recurrent violation modifiers (+5 repeat, +5 multi-category) that objectively identifies high-risk investigation centers"
    - "Protocol Requirement vs. Actual Patient Data Hero Inspection Panel providing regulatory (ICH GCP E6/FDA 21 CFR) audit rationales"
    - "Automated CAPA Generator linking deviation clusters to root causes, corrective/preventive workflows, and mandatory human review sign-offs"
    - "Interactive 30-Day Predictive Risk Trajectory forecasting site compliance velocity based on recent violation density"

  tech_stack:
    languages: ["JavaScript", "HTML", "CSS"]
    frameworks: ["React 18", "Vite", "Tailwind CSS", "React Router v6"]
    ibm_technologies: ["IBM Bob", "watsonx.ai (Architectural Ready)"]
    databases: ["Local State Architecture (FastAPI/PostgreSQL Ready)"]
    other: ["Recharts", "Lucide React"]

  what_we_are_most_proud_of: >         # Optional but recommended
    Our deterministic-first compliance architecture: compliance facts are computed strictly by verifiable rules rather than untrusted LLM generation, ensuring 100% auditability for FDA 21 CFR Part 11 and ICH GCP E6(R2), while AI is reserved for clinical interpretation, root-cause reasoning, and CAPA generation.

  known_limitations: >                 # Optional but recommended
    Currently running on client-side state with realistic synthetic patient cohorts (104 patients across 5 sites); ready for direct binding to FastAPI backend endpoints and IBM watsonx.ai foundation models via the pre-architected integration connectors in Settings.

